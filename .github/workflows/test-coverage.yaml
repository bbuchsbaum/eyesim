# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: test-coverage

permissions:
  contents: read
  id-token: write

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr, any::xml2
          needs: coverage

      - name: Test coverage
        run: |
          cov <- covr::package_coverage(
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"), "package")
          )
          print(cov)
          pct_raw <- covr::percent_coverage(cov)
          pct <- round(pct_raw, 2)
          cat(sprintf("Overall coverage: %s%%\n", pct))
          writeLines(as.character(pct), "coverage-percent.txt")
          writeLines(format(pct_raw, digits = 15, scientific = FALSE), "coverage-percent-raw.txt")
          covr::to_cobertura(cov)
        shell: Rscript {0}

      - name: Report coverage percent
        run: |
          echo "Overall package coverage: $(cat coverage-percent.txt)%"

      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          fail_ci_if_error: true
          files: ./cobertura.xml
          plugins: noop
          disable_search: true
          use_oidc: true

      - name: Enforce 90% coverage threshold
        run: |
          pct_raw <- as.numeric(readLines("coverage-percent-raw.txt"))
          threshold <- 90
          if (is.na(pct_raw) || pct_raw < threshold) {
            stop(
              sprintf(
                "Coverage is %s%%, below the required %s%% threshold",
                format(pct_raw, digits = 15, scientific = FALSE),
                threshold
              ),
              call. = FALSE
            )
          }
          cat(sprintf("Coverage threshold passed: %s%% >= %s%%\n", pct_raw, threshold))
        shell: Rscript {0}

      - name: Show testthat output
        if: always()
        run: |
          ## --------------------------------------------------------------------
          find '${{ runner.temp }}/package' -name 'testthat.Rout*' -exec cat '{}' \; || true
        shell: bash

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-test-failures
          path: ${{ runner.temp }}/package
