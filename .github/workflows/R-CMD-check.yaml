on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }}${{ matrix.config.full && ', full suite' || ', CRAN mode' }})

    strategy:
      fail-fast: false
      matrix:
        config:
          # The full suite (skip_on_cran() tests and inst/validation checks)
          # runs once; the other platforms run what CRAN runs, to catch
          # compiler, BLAS and platform differences before submission.
          - {os: ubuntu-latest,  r: 'release', full: true}
          - {os: ubuntu-latest,  r: 'devel',   full: false, http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'oldrel-1', full: false}
          - {os: macos-latest,   r: 'release', full: false}
          - {os: windows-latest, r: 'release', full: false}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_FORCE_SUGGESTS_: false
      # NOT_CRAN=true runs tests marked skip_on_cran().
      NOT_CRAN: ${{ matrix.config.full && 'true' || 'false' }}
      # inst/validation is not in the built package; on the full-suite job,
      # point its tests at the checkout so they still run.
      EYESIM_SOURCE_DIR: ${{ matrix.config.full && github.workspace || '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, github::bbuchsbaum/albersdown
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          error-on: '"warning"'
